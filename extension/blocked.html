<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected by Orixus Ultimate Focus</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --card: #121418;
      --border: #22262e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .block-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .brand {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .shield-icon {
      width: 48px;
      height: 48px;
      color: var(--text);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .description {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .domain-tag {
      font-family: monospace;
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      color: var(--text);
      font-size: 0.85rem;
    }
    .return-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 24px;
      background-color: var(--text);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="block-card">
    <div class="brand">ORIXUS ULTIMATE FOCUS</div>
    <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      <circle cx="12" cy="11" r="3"></circle>
    </svg>
    <h1 class="title">Access Restricted</h1>
    <p class="description">
      This domain is currently restricted under your active <strong>Orixus Focus Session</strong>.
    </p>
    <div class="domain-tag" id="domainDisplay">Restricted Domain</div>
    <a href="https://orixus.vercel.app/ultimate-focus" target="_blank" class="return-btn">Open Orixus Control Center</a>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
